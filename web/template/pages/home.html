{{define "content"}}

<section class="hero">

    <div class="hero-content">
        <h1 class="display">Учёт личных трат</h1>

        <p class="lead">
            Записывайте расходы за пару секунд — всё сохраняется в базе
            и никуда не пропадёт после перезапуска.
        </p>

        <a href="/expenses" class="btn btn-tonal">
            Все траты
            <span class="icon icon-end" aria-hidden="true">arrow_forward</span>
        </a>
    </div>

    <div class="card">
        <h2 class="card-title">Новая трата</h2>
        {{template "expense-form" .Form}}
    </div>

</section>

{{end}}
