{{define "content"}}

<section class="card auth">
    <h1 class="card-title">Вход</h1>

    {{if .Error}}
    <p class="form-error" role="alert">
        <span class="icon" aria-hidden="true">error</span>
        {{.Error}}
    </p>
    {{end}}

    <form method="POST" action="/login" class="form auth-form">
        <input type="hidden" name="csrf" value="{{.CSRF}}">
        <input type="hidden" name="next" value="{{.Next}}">

        <div class="field">
            <input id="email" type="email" name="email" placeholder=" "
                   value="{{.Email}}" autocomplete="email" maxlength="320" required>
            <label for="email">Email</label>
        </div>

        <div class="field">
            <input id="password" type="password" name="password" placeholder=" "
                   autocomplete="current-password" maxlength="256" required>
            <label for="password">Пароль</label>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-filled">
                <span class="icon" aria-hidden="true">login</span>
                <span class="btn-label">Войти</span>
            </button>
        </div>
    </form>

    <p class="auth-alt"><a href="/forgot">Забыли пароль?</a></p>
    <p class="auth-alt">Нет аккаунта? <a href="/register">Зарегистрируйтесь</a></p>
</section>

{{end}}
