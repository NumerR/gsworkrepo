{{define "base"}}

<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{.Title}} · Учёт трат</title>

    <!-- Внешний файл, а не инлайновый скрипт: политика CSP запрещает unsafe-inline,
         а тема должна быть выставлена до первой отрисовки, чтобы страница не мигала -->
    <script src="/static/js/theme.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=account_balance_wallet,add,arrow_forward,check,dark_mode,delete,edit,error,filter_alt,home,light_mode,login,logout,person_add,receipt_long,search_off&display=block">
    <link rel="stylesheet" href="/static/css/main.css">
</head>

<body>

    {{template "header" .}}

    <main class="container">
        {{block "content" .}}
            <div>error</div>
        {{end}}
    </main>

    <script src="/static/js/main.js"></script>

</body>

</html>

{{end}}
