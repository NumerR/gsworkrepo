{{define "expense-form"}}

<form method="POST" action="{{.Action}}" class="form">

    <div class="field">
        <input id="description" type="text" name="Description" placeholder=" "
               value="{{.Expense.Description}}" maxlength="200" required>
        <label for="description">На что потратили</label>
    </div>

    <div class="form-row">
        <div class="field">
            <input id="amount" type="number" name="Amount" placeholder=" "
                   value="{{.Expense.AmountInput}}" min="0.01" step="0.01" inputmode="decimal" required>
            <label for="amount">Сумма, ₽</label>
        </div>

        <div class="field">
            <input id="date" type="date" name="Date" value="{{.Expense.Date}}" required>
            <label for="date">Дата</label>
        </div>
    </div>

    <div class="actions">
        {{if .Cancel}}
            <a href="{{.Cancel}}" class="btn btn-text">Отмена</a>
        {{end}}

        <button type="submit" class="btn btn-filled">
            <span class="icon" aria-hidden="true">{{if .Cancel}}check{{else}}add{{end}}</span>
            {{.Submit}}
        </button>
    </div>

</form>

{{end}}
